<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Forest Log Viewer</title>
<style>
  body { font-family: Arial, sans-serif; background:#f9f9f9; padding:20px; }
  pre { background:#fff; border:1px solid #ddd; padding:10px; max-height:80vh; overflow:auto; }
  #time { font-weight: bold; }
  .container { display:flex; flex-direction: column; gap:10px; }
  .panel { width:100%; }
</style>
</head>
<body>
<h2>Forest Log Viewer (room_history_report.txt)</h2>
<p>Current time: <span id="time"></span></p>
<div class="container">
  <div class="panel">
    <h3>수락휴</h3>
    <pre id="log-수락휴">Loading...</pre>
  </div>
  <div class="panel">
    <h3>무의도</h3>
    <pre id="log-무의도">Loading...</pre>
  </div>
  <div class="panel">
    <h3>용인자연휴양림</h3>
    <pre id="log-용인자연휴양림">Loading...</pre>
  </div>
</div>
<script>
  function updateTime(){const now=new Date();document.getElementById('time').textContent=now.toLocaleString();}
  setInterval(updateTime,1000);
  updateTime();
  const BASE_URL="https://raw.githubusercontent.com/matrix1970/forest/main";
  const sites=['수락휴','무의도','용인자연휴양림'];
  async function fetchLog(site){
    const url=`${BASE_URL}/${encodeURIComponent(site)}/room_history_report.txt`;
    try{
      const resp=await fetch(url,{cache:'no-store'});
      if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
      const text=await resp.text();
      const lines=text.trim().split(/\r?\n/);
      const last10=lines.slice(-10).join('\n');
      document.getElementById(`log-${site}`).textContent=last10;
    }catch(e){
      document.getElementById(`log-${site}`).textContent=`Error loading log for ${site}: ${e}`;
    }
  }
  function refreshAll(){sites.forEach(fetchLog);}
  refreshAll();
  setInterval(refreshAll,300000);
</script>
</body>
</html>
